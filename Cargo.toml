[workspace]
resolver = "3"
members = [
    "crates/xsysroot",
    "crates/xsysroot-core",
    "crates/xdroid",
    "crates/xios",
    "crates/xlinux",
    "crates/xmac",
    "crates/xohos",
    "crates/xwindows",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["The Xsysroot Project Developers and Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cross-toolchains/xsysroot"
categories = ["development-tools::build-utils", "development-tools", "command-line-utilities"]

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
cli-table = { version = "0.5", default-features = false, features = ["title"] }
flate2 = "1"
indicatif = "0.17"
lzma-rs = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

xsysroot-core = { path = "crates/xsysroot-core", version = "0.1.0" }
xdroid = { path = "crates/xdroid", version = "0.1.0" }
xios = { path = "crates/xios", version = "0.1.0" }
xlinux = { path = "crates/xlinux", version = "0.1.0" }
xmac = { path = "crates/xmac", version = "0.1.0" }
xohos = { path = "crates/xohos", version = "0.1.0" }
xwindows = { path = "crates/xwindows", version = "0.1.0" }
