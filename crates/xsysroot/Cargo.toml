[package]
name = "xsysroot"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Unified cross-platform sysroot manager for Windows, macOS, iOS, Android, Linux, and OpenHarmony."
license.workspace = true
repository.workspace = true
keywords = ["sysroot", "sdk", "toolchain", "cross", "compilation"]
categories.workspace = true

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "xsysroot"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { workspace = true, optional = true }
xdroid = { workspace = true, default-features = false }
xios = { workspace = true, default-features = false }
xlinux = { workspace = true, default-features = false }
xmac = { workspace = true, default-features = false }
xohos = { workspace = true, default-features = false }
xsysroot-core.workspace = true
xwindows = { workspace = true, default-features = false }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
