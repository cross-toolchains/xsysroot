[package]
name = "xwindows"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Utility for downloading and splatting Windows MSVC and MinGW/UCRT sysroots for cross-compilation."
license.workspace = true
repository.workspace = true
keywords = ["windows", "msvc", "mingw", "sysroot", "cross-compilation"]
categories.workspace = true

[dependencies]
anyhow = "1.0"
bytes = "1.10"
cab = "0.6"
camino = "1.0"
clap.workspace = true
cli-table.workspace = true
crossbeam-channel = "0.5"
indicatif.workspace = true
memchr = "2.6"
msi = "0.10"
parking_lot = "0.12"
rayon = "1.10"
regex = "1.11"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.19"
toml = "1.1"
tracing = { version = "0.1", default-features = false, features = ["attributes", "std"] }
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64"] }
ureq = { workspace = true, features = ["gzip", "platform-verifier"] }
versions = "7.0"
walkdir = "2.5"
xsysroot-core.workspace = true
zip.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
