name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v0.2.0) to rebuild and upload binary archives for"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: release-plz release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.extract-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz release
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Extract created release tag
        id: extract-tag
        shell: bash
        run: |
          RELEASES='${{ steps.release.outputs.releases }}'
          if [ -n "$RELEASES" ] && [ "$RELEASES" != "[]" ]; then
            TAG="$(printf '%s' "$RELEASES" | jq -r '.[] | select(.package_name == "xsysroot") | .tag_name // empty')"
            if [ -z "$TAG" ]; then
              TAG="$(printf '%s' "$RELEASES" | jq -r '.[0].tag_name // empty')"
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

  release-plz-pr:
    name: release-plz pr
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    name: Build & Upload (${{ matrix.target }})
    needs: [release-plz-release]
    if: >
      always() &&
      (
        (needs.release-plz-release.result == 'success' && needs.release-plz-release.outputs.tag != '') ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
    env:
      RELEASE_TAG: ${{ needs.release-plz-release.outputs.tag || inputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build all CLI binaries
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target "${{ matrix.target }}" --bins

      - name: Package binaries (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          BIN_DIR="target/${{ matrix.target }}/release"
          for tool in xsysroot xdroid xmac xios xlinux xohos; do
            ARCHIVE="dist/${tool}-${{ matrix.target }}.tar.gz"
            tar -czf "$ARCHIVE" -C "$BIN_DIR" "$tool"
            if command -v sha256sum >/dev/null 2>&1; then
              (cd dist && sha256sum "$(basename "$ARCHIVE")" > "$(basename "$ARCHIVE").sha256")
            else
              (cd dist && shasum -a 256 "$(basename "$ARCHIVE")" > "$(basename "$ARCHIVE").sha256")
            fi
          done
          ls -lh dist

      - name: Package binaries (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $binDir = "target/${{ matrix.target }}/release"
          foreach ($tool in @("xsysroot", "xdroid", "xmac", "xios", "xlinux", "xohos")) {
            $exe = Join-Path $binDir "$tool.exe"
            $archive = Join-Path "dist" "$tool-${{ matrix.target }}.zip"
            Compress-Archive -Path $exe -DestinationPath $archive -Force
            $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
            "$hash  $tool-${{ matrix.target }}.zip" | Out-File -Encoding ascii -NoNewline "$archive.sha256"
          }
          Get-ChildItem dist

      - name: Upload archives to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber
