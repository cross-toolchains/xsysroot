name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

  cross-compile:
    name: Cross-Compile Smoke (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install LLVM clang & lld (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld file unzip

      - name: Install LLVM clang & lld (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"

      - name: Configure LLVM clang & lld (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -d "/c/Program Files/LLVM/bin" ]; then
            echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
          else
            choco install llvm -y
            echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
          fi

      - name: Verify clang and lld
        shell: bash
        run: |
          clang --version
          ld.lld --version || lld --version

      - name: Build xsysroot workspace binaries
        shell: bash
        run: cargo build --release --locked --bins

      - name: Smoke-test CLI list commands
        shell: bash
        run: |
          BIN_DIR="$PWD/target/release"
          "$BIN_DIR/xsysroot" list
          "$BIN_DIR/xdroid" list
          "$BIN_DIR/xmac" list
          "$BIN_DIR/xlinux" list
          "$BIN_DIR/xohos" list
          "$BIN_DIR/xios" list

      - name: Prepare test C source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/xtest"
          cat <<'EOF' > "$RUNNER_TEMP/xtest/hello.c"
          #include <stdio.h>
          int main(void) {
              puts("hello from xsysroot CI");
              return 0;
          }
          EOF

      - name: Cross-compile for Android (xdroid)
        shell: bash
        run: |
          BIN_DIR="$PWD/target/release"
          WORK="$RUNNER_TEMP/xtest"
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".cmd"; fi
          "$BIN_DIR/xdroid" splat --accept-license --verbose --output "$WORK/android"
          "$WORK/android/bin/aarch64-linux-android24-clang${EXT}" \
            "$WORK/hello.c" -o "$WORK/hello_android"
          test -s "$WORK/hello_android"
          if command -v file >/dev/null 2>&1; then file "$WORK/hello_android"; fi

      - name: Cross-compile for Linux glibc & musl (xlinux)
        shell: bash
        run: |
          BIN_DIR="$PWD/target/release"
          WORK="$RUNNER_TEMP/xtest"
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".cmd"; fi

          "$BIN_DIR/xlinux" splat --target x86_64-unknown-linux-gnu --glibc 2.31 --verbose --output "$WORK/linux-gnu"
          "$WORK/linux-gnu/bin/x86_64-unknown-linux-gnu-clang${EXT}" \
            "$WORK/hello.c" -o "$WORK/hello_linux_gnu"
          test -s "$WORK/hello_linux_gnu"
          if command -v file >/dev/null 2>&1; then file "$WORK/hello_linux_gnu"; fi

          "$BIN_DIR/xlinux" splat --target aarch64-unknown-linux-musl --verbose --output "$WORK/linux-musl"
          "$WORK/linux-musl/bin/aarch64-unknown-linux-musl-clang${EXT}" \
            -c "$WORK/hello.c" -o "$WORK/hello_linux_musl.o"
          test -s "$WORK/hello_linux_musl.o"

      - name: Cross-compile for macOS (xmac)
        shell: bash
        run: |
          BIN_DIR="$PWD/target/release"
          WORK="$RUNNER_TEMP/xtest"
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".cmd"; fi
          "$BIN_DIR/xmac" splat --accept-license --verbose --output "$WORK/macos"
          "$WORK/macos/bin/aarch64-apple-darwin-clang${EXT}" \
            "$WORK/hello.c" -o "$WORK/hello_macos"
          test -s "$WORK/hello_macos"
          if command -v file >/dev/null 2>&1; then file "$WORK/hello_macos"; fi

      - name: Cross-compile for iOS (xios + xybp888/iOS-SDKs)
        shell: bash
        run: |
          BIN_DIR="$PWD/target/release"
          WORK="$RUNNER_TEMP/xtest"
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".cmd"; fi
          mkdir -p "$WORK/ios-raw"
          curl -fsSL \
            "https://github.com/xybp888/iOS-SDKs/releases/download/iOS26.5-SDKs/iPhoneOS26.5.sdk.zip" \
            -o "$WORK/ios-raw/iPhoneOS.sdk.zip"
          if [ "${{ runner.os }}" = "Windows" ]; then
            /c/Windows/System32/tar.exe -xf "$WORK/ios-raw/iPhoneOS.sdk.zip" -C "$WORK/ios-raw"
          else
            unzip -q "$WORK/ios-raw/iPhoneOS.sdk.zip" -d "$WORK/ios-raw"
          fi
          SDK_DIR="$(find "$WORK/ios-raw" -maxdepth 2 -type d -name 'iPhoneOS*.sdk' -not -path '*/__MACOSX/*' | head -n 1)"
          test -n "$SDK_DIR"
          "$BIN_DIR/xios" splat --from "$SDK_DIR" --verbose --output "$WORK/ios"
          "$WORK/ios/bin/aarch64-apple-ios-clang${EXT}" \
            "$WORK/hello.c" -o "$WORK/hello_ios"
          test -s "$WORK/hello_ios"
          if command -v file >/dev/null 2>&1; then file "$WORK/hello_ios"; fi

      - name: Host Xcode.app auto-detection & simulator smoke (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BIN_DIR="$PWD/target/release"
          WORK="$RUNNER_TEMP/xtest"
          "$BIN_DIR/xios" splat --simulator --verbose --output "$WORK/ios-local"
          "$WORK/ios-local/bin/aarch64-apple-ios-clang" \
            "$WORK/hello.c" -o "$WORK/hello_ios_local"
          "$WORK/ios-local/bin/aarch64-apple-ios-sim-clang" \
            "$WORK/hello.c" -o "$WORK/hello_ios_sim"
          test -s "$WORK/hello_ios_local"
          test -s "$WORK/hello_ios_sim"
          file "$WORK/hello_ios_local" "$WORK/hello_ios_sim"

      - name: Cross-compile for OpenHarmony (xohos)
        shell: bash
        run: |
          BIN_DIR="$PWD/target/release"
          WORK="$RUNNER_TEMP/xtest"
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".cmd"; fi
          "$BIN_DIR/xohos" splat --verbose --output "$WORK/ohos"
          "$WORK/ohos/bin/aarch64-unknown-linux-ohos-clang${EXT}" \
            "$WORK/hello.c" -o "$WORK/hello_ohos"
          test -s "$WORK/hello_ohos"
          if command -v file >/dev/null 2>&1; then file "$WORK/hello_ohos"; fi

      - name: Rust cargo cross-compile smoke (all 6 targets on Linux, macOS & Windows)
        shell: bash
        run: |
          WORK="$RUNNER_TEMP/xtest"
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".cmd"; fi
          mkdir -p "$WORK/rust-smoke/src"
          cat <<'EOF' > "$WORK/rust-smoke/Cargo.toml"
          [package]
          name = "rust-smoke"
          version = "0.1.0"
          edition = "2024"
          EOF
          cat <<'EOF' > "$WORK/rust-smoke/src/main.rs"
          fn main() {
              println!("hello from rust xsysroot CI");
          }
          EOF

          rustup target add \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-musl \
            aarch64-apple-darwin \
            aarch64-apple-ios \
            aarch64-linux-android \
            aarch64-unknown-linux-ohos

          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER="$WORK/linux-gnu/bin/x86_64-unknown-linux-gnu-clang${EXT}" \
            cargo build --manifest-path "$WORK/rust-smoke/Cargo.toml" --target x86_64-unknown-linux-gnu
          test -s "$WORK/rust-smoke/target/x86_64-unknown-linux-gnu/debug/rust-smoke"
          if command -v file >/dev/null 2>&1; then file "$WORK/rust-smoke/target/x86_64-unknown-linux-gnu/debug/rust-smoke"; fi

          cargo build --manifest-path "$WORK/rust-smoke/Cargo.toml" --target aarch64-unknown-linux-musl
          test -s "$WORK/rust-smoke/target/aarch64-unknown-linux-musl/debug/rust-smoke"
          if command -v file >/dev/null 2>&1; then file "$WORK/rust-smoke/target/aarch64-unknown-linux-musl/debug/rust-smoke"; fi

          CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER="$WORK/macos/bin/aarch64-apple-darwin-clang${EXT}" \
            cargo build --manifest-path "$WORK/rust-smoke/Cargo.toml" --target aarch64-apple-darwin
          test -s "$WORK/rust-smoke/target/aarch64-apple-darwin/debug/rust-smoke"
          if command -v file >/dev/null 2>&1; then file "$WORK/rust-smoke/target/aarch64-apple-darwin/debug/rust-smoke"; fi

          CARGO_TARGET_AARCH64_APPLE_IOS_LINKER="$WORK/ios/bin/aarch64-apple-ios-clang${EXT}" \
            cargo build --manifest-path "$WORK/rust-smoke/Cargo.toml" --target aarch64-apple-ios
          test -s "$WORK/rust-smoke/target/aarch64-apple-ios/debug/rust-smoke"
          if command -v file >/dev/null 2>&1; then file "$WORK/rust-smoke/target/aarch64-apple-ios/debug/rust-smoke"; fi

          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$WORK/android/bin/aarch64-linux-android24-clang${EXT}" \
            cargo build --manifest-path "$WORK/rust-smoke/Cargo.toml" --target aarch64-linux-android
          test -s "$WORK/rust-smoke/target/aarch64-linux-android/debug/rust-smoke"
          if command -v file >/dev/null 2>&1; then file "$WORK/rust-smoke/target/aarch64-linux-android/debug/rust-smoke"; fi

          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER="$WORK/ohos/bin/aarch64-unknown-linux-ohos-clang${EXT}" \
            cargo build --manifest-path "$WORK/rust-smoke/Cargo.toml" --target aarch64-unknown-linux-ohos
          test -s "$WORK/rust-smoke/target/aarch64-unknown-linux-ohos/debug/rust-smoke"
          if command -v file >/dev/null 2>&1; then file "$WORK/rust-smoke/target/aarch64-unknown-linux-ohos/debug/rust-smoke"; fi
