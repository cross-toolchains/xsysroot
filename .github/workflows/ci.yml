name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

  cross-compile:
    name: Cross-Compile Smoke (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install LLVM clang & lld (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld file unzip

      - name: Install LLVM clang & lld (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"

      - name: Configure LLVM clang & lld (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -d "/c/Program Files/LLVM/bin" ]; then
            echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
          else
            choco install llvm -y
            echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
          fi

      - name: Verify clang and lld
        shell: bash
        run: |
          clang --version
          ld.lld --version || lld --version

      - name: Build xsysroot workspace binaries
        shell: bash
        run: cargo build --release --locked --bins

      - name: Smoke-test CLI list commands
        shell: bash
        run: |
          BIN_DIR="$PWD/target/release"
          "$BIN_DIR/xsysroot" list
          "$BIN_DIR/xdroid" list
          "$BIN_DIR/xmac" list
          "$BIN_DIR/xlinux" list
          "$BIN_DIR/xohos" list
          "$BIN_DIR/xios" list

      - name: Prepare test C source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/xtest"
          cat <<'EOF' > "$RUNNER_TEMP/xtest/hello.c"
          #include <stdio.h>
          int main(void) {
              puts("hello from xsysroot CI");
              return 0;
          }
          EOF

      - name: Cross-compile for Android (xdroid)
        shell: bash
        run: |
          BIN_DIR="$PWD/target/release"
          WORK="$RUNNER_TEMP/xtest"
          "$BIN_DIR/xdroid" splat --accept-license --verbose --output "$WORK/android"
          clang --target=aarch64-linux-android21 \
            --sysroot="$WORK/android/sysroot" \
            -fuse-ld=lld -nodefaultlibs -lc \
            "$WORK/hello.c" -o "$WORK/hello_android"
          test -s "$WORK/hello_android"
          if command -v file >/dev/null 2>&1; then file "$WORK/hello_android"; fi

      - name: Cross-compile for Linux glibc & musl (xlinux)
        shell: bash
        run: |
          BIN_DIR="$PWD/target/release"
          WORK="$RUNNER_TEMP/xtest"

          "$BIN_DIR/xlinux" splat --target x86_64-unknown-linux-gnu --glibc 2.31 --verbose --output "$WORK/linux-gnu"
          if [ "${{ runner.os }}" = "Windows" ]; then
            clang --target=x86_64-unknown-linux-gnu \
              --sysroot="$WORK/linux-gnu/sysroot" \
              -c "$WORK/hello.c" -o "$WORK/hello_linux_gnu.o"
            test -s "$WORK/hello_linux_gnu.o"
          else
            clang --target=x86_64-unknown-linux-gnu \
              --sysroot="$WORK/linux-gnu/sysroot" \
              --gcc-toolchain="$WORK/linux-gnu/sysroot/usr" \
              -fuse-ld=lld \
              "$WORK/hello.c" -o "$WORK/hello_linux_gnu"
            test -s "$WORK/hello_linux_gnu"
            file "$WORK/hello_linux_gnu"
          fi

          "$BIN_DIR/xlinux" splat --target aarch64-unknown-linux-musl --verbose --output "$WORK/linux-musl"
          clang --target=aarch64-unknown-linux-musl \
            --sysroot="$WORK/linux-musl/sysroot" \
            -c "$WORK/hello.c" -o "$WORK/hello_linux_musl.o"
          test -s "$WORK/hello_linux_musl.o"

      - name: Cross-compile for macOS (xmac)
        shell: bash
        run: |
          BIN_DIR="$PWD/target/release"
          WORK="$RUNNER_TEMP/xtest"
          "$BIN_DIR/xmac" splat --accept-license --verbose --output "$WORK/macos"
          if [ "${{ runner.os }}" = "Windows" ]; then
            clang --target=aarch64-apple-darwin \
              -isysroot "$WORK/macos/MacOSX.sdk" \
              -c "$WORK/hello.c" -o "$WORK/hello_macos.o"
            test -s "$WORK/hello_macos.o"
          else
            clang --target=aarch64-apple-darwin \
              -isysroot "$WORK/macos/MacOSX.sdk" \
              -fuse-ld=lld \
              "$WORK/hello.c" -o "$WORK/hello_macos"
            test -s "$WORK/hello_macos"
            file "$WORK/hello_macos"
          fi

      - name: Cross-compile for iOS (xios + xybp888/iOS-SDKs)
        shell: bash
        run: |
          BIN_DIR="$PWD/target/release"
          WORK="$RUNNER_TEMP/xtest"
          mkdir -p "$WORK/ios-raw"
          curl -fsSL \
            "https://github.com/xybp888/iOS-SDKs/releases/download/iOS26.5-SDKs/iPhoneOS26.5.sdk.zip" \
            -o "$WORK/ios-raw/iPhoneOS.sdk.zip"
          unzip -q "$WORK/ios-raw/iPhoneOS.sdk.zip" -d "$WORK/ios-raw"
          SDK_DIR="$(find "$WORK/ios-raw" -maxdepth 2 -type d -name 'iPhoneOS*.sdk' -not -path '*/__MACOSX/*' | head -n 1)"
          test -n "$SDK_DIR"
          "$BIN_DIR/xios" splat --from "$SDK_DIR" --verbose --output "$WORK/ios"
          if [ "${{ runner.os }}" = "Windows" ]; then
            clang --target=aarch64-apple-ios \
              -miphoneos-version-min=15.0 \
              -isysroot "$WORK/ios/iPhoneOS.sdk" \
              -c "$WORK/hello.c" -o "$WORK/hello_ios.o"
            test -s "$WORK/hello_ios.o"
          else
            clang --target=aarch64-apple-ios \
              -miphoneos-version-min=15.0 \
              -isysroot "$WORK/ios/iPhoneOS.sdk" \
              -fuse-ld=lld \
              "$WORK/hello.c" -o "$WORK/hello_ios"
            test -s "$WORK/hello_ios"
            file "$WORK/hello_ios"
          fi

      - name: Cross-compile for OpenHarmony (xohos)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BIN_DIR="$PWD/target/release"
          WORK="$RUNNER_TEMP/xtest"
          "$BIN_DIR/xohos" splat --verbose --output "$WORK/ohos"
          clang --target=aarch64-linux-ohos \
            --sysroot="$WORK/ohos/sysroot" \
            -fuse-ld=lld -nodefaultlibs -lc \
            "$WORK/hello.c" -o "$WORK/hello_ohos"
          test -s "$WORK/hello_ohos"
          file "$WORK/hello_ohos"
